version: 2

models:
  - name: stg_gold__macro_monthly
    description: >
      Monthly macro panel from the gold export, renamed to explicit units. Nulls
      are preserved — series start at different months and the difference between
      "not published yet" and "zero" matters downstream.
    columns:
      - name: month
        description: First day of the reference month.
        data_tests:
          - not_null
          - unique
      - name: selic_target_pct
        description: Copom SELIC target, % p.a., month-end observation.
      - name: ipca_mom_pct
        description: IPCA month-over-month change, %.
      - name: usd_brl_rate
        description: USD/BRL PTAX, month-end.
      - name: debt_to_gdp_pct
        description: Gross general-government debt, % of GDP.

  - name: stg_gold__di_futures
    description: >
      DI1 (one-day interbank deposit) futures strip — one row per trade date and
      listed expiration, restricted to contracts that actually carry a settlement
      rate.
    columns:
      - name: contract_key
        description: Surrogate key, `trade_date|contract_symbol`.
        data_tests:
          - not_null
          - unique
      - name: trade_date
        description: Trade/settlement date.
        data_tests:
          - not_null
      - name: contract_symbol
        description: B3 contract symbol, e.g. `DI1F27`.
        data_tests:
          - not_null
      - name: expiration_date
        description: Contract expiration date.
        data_tests:
          - not_null
      - name: days_to_maturity
        description: Calendar days to expiration. Strictly positive by construction.
        data_tests:
          - not_null
      - name: tenor_years
        description: Calendar years to expiration (`days_to_maturity / 365.25`).
        data_tests:
          - not_null
      - name: di_rate_pct
        description: Settlement rate, % p.a.
        data_tests:
          - not_null
      - name: has_open_interest
        description: Whether the contract closed with open interest.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

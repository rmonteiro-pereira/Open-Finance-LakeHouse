  - {id: estadao-einvestidor, name: "Estadão E-Investidor", tier: headline_only, url: "https://www.estadao.com.br/arc/outboundfeeds/feeds/rss/sections/einvestidor/"}
  - {id: folha-mercado, name: "Folha Mercado", tier: headline_only, url: "https://feeds.folha.uol.com.br/mercado/rss091.xml"}

# Managers whose letters the documents lane archives, and how each one publishes.
#
# Source of this list: docs/research/fund-letters-sources.md, table A (sites opened and
# checked on 2026-10-08). Only the two generic mechanisms are here; managers that need
# their own adapter (Verde's JSON, Legacy's ajax, HTML-only letters) come later, and sites
# behind bot challenges are not collected at all.
#
#   wp_media    WordPress media library over its public REST API (every PDF on the site;
#               a name/title filter keeps the letters).
#   page_links  PDF links on pages that are a letters listing.
managers:

name: ofl_gold
version: "0.1.0"
config-version: 2

profile: ofl_gold

flags:
  # dbt is moving generic-test arguments under an explicit `arguments:` key.
  # Opting into the behaviour change now keeps the YAML on the forward syntax
  # instead of accruing deprecation warnings on every parse.
  require_generic_test_arguments_property: true

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ofl_gold:
    staging:
      # Staging is a thin, non-materialised rename/filter layer over the exported
      # gold marts — cheap to rebuild, never worth storing.
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

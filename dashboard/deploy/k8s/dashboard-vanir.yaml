# Ledger dashboard — public deploy at dashboard.vanir.dev.br (namespace: default)
#
# Mirrors the fluxo conventions:
#   - private wildcard *.vanir.dev.br A -> 192.168.32.70 makes this LAN/Tailscale-reachable
#     immediately; a proxied Cloudflare CNAME `dashboard` -> the homelab tunnel makes it
#     PUBLIC (added separately — see deploy notes).
#   - TLS is served by the ingress-nginx default certificate (ingress-nginx/vanir-dev-br-tls),
#     so the Ingress carries no tls block (same as fluxo).
#   - private image pulled from GHCR via the existing `ghcr-pull` secret in `default`.
#
# This serves the baked SYNTHETIC snapshot (zero backend). To switch to live Delta,
# layer the PVC + CronJob from dashboard.yaml on top.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ofl-dashboard
  namespace: default
  labels: { app: ofl-dashboard }
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO PVC shared with the refresh CronJob
  selector:
    matchLabels: { app: ofl-dashboard }
  template:
    metadata:
      labels: { app: ofl-dashboard }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: ghcr.io/rmonteiro-pereira/ofl-dashboard:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
          # The PVC carries the LIVE snapshot (written by the export Job/CronJob),
          # mounted over the image's baked synthetic data.
          volumeMounts:
            - { name: data, mountPath: /app/public/data }
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next ISR writes to .next/cache
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 640Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ofl-dash-data
---
apiVersion: v1
kind: Service
metadata:
  name: ofl-dashboard
  namespace: default
spec:
  selector: { app: ofl-dashboard }
  ports:
    - { port: 80, targetPort: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ofl-dashboard
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.vanir.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ofl-dashboard
                port: { number: 80 }
---
# Hourly live refresh: runs snapshot/export.py against MinIO into the shared PVC.
# Pages are force-dynamic, so the dashboard picks up the new snapshot on next request.
# Prereq: configmap `ofl-dash-export` (from snapshot/export.py) + secret `minio-creds`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ofl-dash-refresh
  namespace: default
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: export
              image: python:3.12-slim
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              env:
                - { name: HOME, value: /tmp }
                - { name: PIP_NO_CACHE_DIR, value: "1" }
                - { name: MINIO_ENDPOINT, value: "http://minio.minio.svc.cluster.local:9000" }
                - { name: BUCKET, value: "lakehouse" }
              envFrom:
                - secretRef: { name: minio-creds }
              command:
                - sh
                - -c
                - pip install --user --quiet 'duckdb>=0.10' && DASH_DATA_DIR=/data python /scripts/export.py
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: script, mountPath: /scripts }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: ofl-dash-data }
            - name: script
              configMap: { name: ofl-dash-export }

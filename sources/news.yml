  - {id: valor-investe, name: "Valor Investe", tier: headline_only, url: "https://pox.globo.com/rss/valorinveste/"}
  - {id: pipeline, name: "Pipeline (Valor)", tier: headline_only, url: "https://pipelinevalor.globo.com/rss/pipelinevalor/"}

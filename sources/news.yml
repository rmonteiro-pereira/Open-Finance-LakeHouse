  - {id: fazenda, name: "Ministério da Fazenda", tier: official, url: "https://www.gov.br/fazenda/pt-br/@@search_rss?portal_type:list=News%20Item&sort_on=Date&sort_order=reverse"}
  - {id: agencia-brasil-economia, name: "Agência Brasil Economia", tier: official, url: "https://agenciabrasil.ebc.com.br/rss/economia/feed.xml"}

  # --- full text offered in the outlet's own feed, no clause against automation found ---
  - {id: infomoney, name: "InfoMoney", tier: feed_fulltext, url: "https://www.infomoney.com.br/feed/"}
  - {id: moneytimes, name: "Money Times", tier: feed_fulltext, url: "https://www.moneytimes.com.br/feed/"}
  - {id: seudinheiro, name: "Seu Dinheiro", tier: feed_fulltext, url: "https://www.seudinheiro.com/feed/"}

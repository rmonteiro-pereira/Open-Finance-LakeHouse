[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ofl"
version = "0.1.0"
description = "Open-Finance LakeHouse — Brazilian macro & financial data lakehouse (Polars extract / Spark refine / DuckDB serve)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.1",
    "deltalake>=0.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    "structlog>=24.1",
    "pandera>=0.20",
    "boto3>=1.34",
    # Bronze write path: polars.to_arrow() + deltalake.write_deltalake both need
    # pyarrow, and it is not pulled in transitively by deltalake>=0.21 — declare it.
    "pyarrow>=14",
]

# Heavy / lane-specific deps are extras so the core (Polars + DuckDB) installs light.
[project.optional-dependencies]
spark = ["pyspark>=3.5,<3.6", "delta-spark>=3.2,<3.4"]
# Streaming lane: the producer speaks WebSocket to the public exchange feed.
# The Spark side of the lane needs the ``spark`` extra as well.
streaming = ["websockets>=12.0"]
airflow = ["apache-airflow>=3.0"]
yahoo = ["yfinance>=0.2.40"]
lineage = ["openlineage-python>=1.20"]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]
research = [
    "mcp>=1.26,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pdfplumber>=0.11,<1",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5,<7",
    "uvicorn>=0.30,<1",
]
research-ocr = [
    "opencv-python-headless>=4.10,<5",
]
research-search = ["sentence-transformers>=3,<6", "torch>=2.6"]
research-pilot = ["qdrant-client>=1.12,<2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "research-search" }]

[project.scripts]
ofl = "ofl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ofl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL"]
ignore = ["E501", "PLR0913"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Mutation gate for the research functions that decide access, money and evidence
# integrity. tools/mutation_gate.sh selects the gated functions and checks the targets.
[tool.mutmut]
paths_to_mutate = ["ofl/"]
do_not_mutate = [
    "ofl/__init__.py",
    "ofl/cli.py",
    "ofl/config.py",
    "ofl/publish.py",
    "ofl/registry.py",
    "ofl/documents/*",
    "ofl/ingestion/*",
    "ofl/platform/*",
    "ofl/quality/*",
    "ofl/streaming/*",
    "ofl/transform/*",
    "ofl/research/__init__.py",
    "ofl/research/archive.py",
    "ofl/research/cli.py",
    "ofl/research/db.py",
    "ofl/research/imports.py",
    "ofl/research/library.py",
    "ofl/research/macro.py",
    "ofl/research/mcp.py",
    "ofl/research/orchestration.py",
    "ofl/research/outcomes.py",
    "ofl/research/pilot.py",
    "ofl/research/processing.py",
    "ofl/research/retrieval_*",
    # search.py is mutated, but only its functions listed in the gate's SCOPES run.
    "ofl/research/storage.py",
    "ofl/research/worker.py",
]
tests_dir = [
    "tests/test_research_access.py",
    "tests/test_research_money.py",
    "tests/test_research_evidence.py",
    "tests/test_research.py",
    "tests/test_research_agents.py",
    "tests/test_dataset_reproduction.py",
    "tests/test_workbench.py",
    "tests/test_product_workflows.py",
    "tests/test_jurisdiction.py",
    # These start a separate interpreter that cannot load the mutated package.
    "--deselect=tests/test_research_agents.py::test_real_stdio_mcp_initialization_and_discovery",
    "--deselect=tests/test_dataset_reproduction.py::test_offline_reproduction_matches_server_for_null_calendars_and_transforms",
]

  - {id: bloomberg-linea, name: "Bloomberg Línea Brasil", tier: feed_fulltext, url: "https://www.bloomberglinea.com.br/arc/outboundfeeds/rss/?outputType=xml"}
  - {id: g1-economia, name: "G1 Economia", tier: feed_fulltext, url: "https://g1.globo.com/rss/g1/economia/"}


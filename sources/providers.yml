# =============================================================================
# Provider registry — who owns each source, and what may be done with it.
#
# KEYED BY HANDLER, not by rights holder. The provenance column that travels
# through every fact and every mart is stamped from `series.handler`, and the
# registry has ten handlers against seven rights holders (B3 alone owns four
# handlers). Keying this file by rights holder would leave the mapping from the
# stamped value to the verdict undefined — which is exactly where a licence gate
# stops being enforceable.
#
# `rights_holder` is therefore a FIELD, for presentation and for grouping the
# verdicts a human has to read. The KEY is what the data carries.
#
# DEFAULT IS DENY. A handler with no entry here, or with
# `redistributable: unverified`, cannot be published. Silence counts as red —
# an unaudited term of use is not permission, and the cost of being wrong is
# redistributing someone else's data.
#
# `exhibit` vs `redistribute` are different questions and are recorded
# separately: a mart derived internally from a source we may not republish can
# still be the right thing to *show*, provided the derivative is ours and the
# page says so.
#
# Every entry needs `verdict_date` and `verdict_by`. A verdict with no date is a
# verdict nobody can age out.
# =============================================================================


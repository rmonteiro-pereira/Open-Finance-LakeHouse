# Profile for the dbt lane. Kept inside the project so the whole thing is
# self-contained: `dbt build --profiles-dir .` from `dbt/` just works.
#
# Two databases are in play on purpose:
#   * `gold_export` — the exported gold snapshot, ATTACHed READ_ONLY. dbt sources
#     read from it and nothing in this project can ever write to it.
#   * the target file (`path`) — a throwaway DuckDB database this project owns,
#     where staging views and mart tables are materialised. Gitignored.
ofl_gold:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Writable target — created on first run, safe to delete at any time.
      path: "{{ env_var('OFL_DBT_TARGET_DB', 'ofl_dbt_dev.duckdb') }}"
      threads: 4
      attach:
        - path: "{{ env_var('OFL_GOLD_DUCKDB', 'gold_export.duckdb') }}"
          alias: gold_export
          read_only: true

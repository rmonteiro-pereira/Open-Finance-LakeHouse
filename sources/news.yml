# News sources for the documents lane, and how much of each item is kept.
#
# Source of this list: docs/research/news-sources.md (feeds fetched on 2026-10-08).
# Tiers are explained in ofl/documents/news.py. Reuters is absent on purpose: its robots
# file disallows everything and it forbids automated collection outright.
sources:
  # --- official: public bodies -------------------------------------------------------
  - {id: bcb-noticias, name: "BCB notícias", tier: official, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/noticias"}
  - {id: bcb-notas-imprensa, name: "BCB notas à imprensa", tier: official, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notasImprensa"}
  - {id: bcb-copom-comunicados, name: "BCB comunicados do Copom", tier: official, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/comunicadoscopom"}
  - {id: bcb-copom-atas, name: "BCB atas do Copom", tier: official, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/atascopom"}
  - {id: bcb-focus, name: "BCB Focus", tier: official, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/focus"}
  - {id: ibge, name: "Agência IBGE", tier: official, url: "https://agenciadenoticias.ibge.gov.br/agencia-rss"}
  - {id: ipea, name: "IPEA", tier: official, url: "https://www.ipea.gov.br/portal/categorias/45-todas-as-noticias/noticias?format=feed&type=rss"}
